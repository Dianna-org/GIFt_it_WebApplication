services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: birthdaycards
      Jwt__Key: ${JWT_KEY:?Copy .env.example to .env first}
      Security__PasswordPepper: ${PASSWORD_PEPPER:?Run ./deploy.sh once (it adds PASSWORD_PEPPER to .env)}
      Cors__Origins: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  mongo-data:
